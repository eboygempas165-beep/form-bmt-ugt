<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORM BMT UGT - Formulir Pembiayaan KSPPS BMT UGT Nusantara</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* =====================================================================
       BASE & PAPER SHEET STYLING (1:1 PHYSICAL A4 FORM APPEARANCE)
       ===================================================================== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #525659; /* Nuansa meja kerja / PDF viewer */
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      -webkit-font-smoothing: antialiased;
    }

    /* Lembaran Kertas A4 */
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      margin: 14px auto;
      padding: 10mm 12mm 10mm 12mm;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      position: relative;
      color: #000000;
      font-size: 9.2pt;
      line-height: 1.28;
    }

    .font-serif-doc {
      font-family: 'Times New Roman', Times, serif;
    }

    /* Input Garis Titik-Titik Langsung di Atas Kertas */
    .paper-input {
      border: none;
      border-bottom: 1px dotted #000000;
      background: transparent;
      font-family: inherit;
      font-size: inherit;
      font-weight: 600;
      color: #000000;
      padding: 0 3px;
      outline: none;
      border-radius: 0;
    }
    .paper-input:focus {
      background-color: #fefce8;
      border-bottom: 1.5px solid #1b6b50;
    }
    .paper-input::placeholder {
      color: #9ca3af;
      font-weight: 400;
      font-style: italic;
    }

    .paper-textarea {
      width: 100%;
      border: 1px solid #000000;
      background: transparent;
      font-family: inherit;
      font-size: 8.8pt;
      color: #000000;
      padding: 4px 6px;
      outline: none;
      resize: vertical;
    }
    .paper-textarea:focus {
      background-color: #fefce8;
    }

    /* Checkbox Kotak Nyata Seperti Cetakan */
    .paper-chk {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
      margin-right: 7px;
      vertical-align: middle;
    }
    .paper-chk-box {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 1px solid #000000;
      text-align: center;
      line-height: 10px;
      font-size: 8.5pt;
      font-weight: bold;
      margin-right: 3px;
      background: #ffffff;
      color: #000000;
      flex-shrink: 0;
    }
    .paper-chk.checked .paper-chk-box {
      background: #e6f4ee;
    }

    /* Opsi Coret Yang Tidak Perlu */
    .strike-opt {
      cursor: pointer;
      padding: 0 2px;
      user-select: none;
    }
    .strike-opt.crossed {
      text-decoration: line-through;
      color: #6b7280;
    }
    .strike-opt.active-opt {
      font-weight: bold;
    }

    /* Tabel Formulir Bergaris Hitam Tegas */
    .form-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8.3pt;
    }
    .form-table th,
    .form-table td {
      border: 1px solid #000000;
      padding: 2.5px 4px;
      vertical-align: middle;
    }
    .form-table th {
      font-weight: bold;
      text-align: center;
      background-color: #f3f4f6;
    }

    .cell-input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: inherit;
      color: #000000;
      padding: 1px 2px;
      outline: none;
    }
    .cell-input:focus {
      background-color: #fefce8;
    }

    .layout-table {
      width: 100%;
      border-collapse: collapse;
    }
    .layout-table td {
      padding: 1.8px 2px;
      vertical-align: top;
    }

    /* Kotak Cabang / Capem Ringkas & Proporsional */
    .cabang-box {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #000000;
      padding: 2.5px 8px;
      font-size: 8.5pt;
      font-weight: bold;
      width: auto;
      max-width: 280px;
      white-space: nowrap;
    }
    .cabang-box .cabang-in {
      border: none;
      border-bottom: 1px dotted #000000;
      background: transparent;
      font-family: inherit;
      font-size: 8.5pt;
      font-weight: bold;
      color: #000000;
      padding: 0 2px;
      outline: none;
      width: 140px;
    }
    .cabang-box .cabang-in:focus {
      background-color: #fefce8;
      border-bottom: 1.5px solid #1b6b50;
    }

    /* Responsive wrapper di layar HP agar kertas A4 tetap proporsional 1:1 dan bisa digeser */
    .paper-viewport {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 30px;
    }

    /* =====================================================================
       PRINT STYLES (@media print) - 100% IDENTIK DENGAN DOKUMEN FISIK A4
       ===================================================================== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      .paper-viewport {
        overflow: visible !important;
        padding: 0 !important;
      }
      .a4-sheet {
        width: 100% !important;
        min-height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        page-break-after: always;
        break-after: page;
      }
      .a4-sheet:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .paper-input,
      .cell-input,
      .paper-textarea {
        background: transparent !important;
      }
      .paper-input::placeholder,
      .cell-input::placeholder {
        color: transparent !important;
      }
    }
  </style>
</head>
<body>

  <script>
    // =========================================================================
    // 1. MASTER DATA: 39 PERTANYAAN QUESTIONER SURVEY (PMB/FRM/004/REV00)

    const QUESTIONER_39 = [
      { no: 1, q: "Apakah calon debitur (Pemohon) memiliki hubungan dengan BMT? (yang tidak baik langsung ditolak)", opts: { a: "Pernah pinjam tapi kurang disiplin", b: "belum (tidak) ada hubungan sebelumnya", c: "Pernah meminjam (disiplin) dan masih menabung", d: "Sering meminjam (disiplin) dan rutin menabung" } },

      { no: 5, q: "Apa status tempat tinggal pemohon?", opts: { a: "Ngontrak/kost", b: "Numpang wali/saudara/rumah dinas", c: "Rumah sendiri tapi pendatang", d: "Rumah sendiri dan bukan pendatang" } },
      { no: 6, q: "Bagaimana calon debitur dikenal di tempat tinggalnya? (responden min 5 Orang)", opts: { a: "dikenal tidak baik (pernyataan 3-5 orang)", b: "dikenal tidak baik (pernyataan 2 orang)", c: "dikenal baik (pernyataan 3 orang)", d: "dikenal baik (pernyataan 4-5 orang)" } },
      { no: 7, q: "Bagaimana calon debitur dikenal di lingkungan kerja/organisasinya?", opts: { a: "Dikenal tidak baik (pernyataan secara umum/mutawatir)", b: "Dikenal tidak baik (sebagian responden) atau tidak dikenal karena kurang bergaul", c: "Dikenal baik oleh sebagian, dan jarang bergaul", d: "Dikenal baik dan supel (umum/mutawatir)" } },
      { no: 8, q: "Dia tidak banyak dikenal karena:", opts: { a: "Jarang ada dirumah", b: "Tertutup dan tidak supel (kurang bergaul)", c: "Pendatang (Bukan penduduk tetap)", d: "Orang baru atau pendatang (penduduk tetap)" } },

      { no: 10, q: "Bagaimana perilaku dan tutur kata calon debitur saat wawancara?", opts: { a: "Tidak respek, tidak tenang, tidak tulus, ragu-ragu, dan atau tidak terbuka", b: "Respek tapi tidak tenang, tidak tulus, ragu-ragu, kurang terbuka", c: "Respek, tulus, terbuka tapi kurang meyakinkan", d: "Respek, tulus, terbuka, tidak ragu-ragu dan meyakinkan" } },
      { no: 11, q: "Apa tujuan penggunaan pembiayaan pemohon?", opts: { a: "Bayar hutang/biaya berobat/biaya pendidikan/biaya-biaya lain", b: "pembelian barang", c: "Usaha (dagang/tani/dan lain-lainnya) baru", d: "Tambahan modal usaha yang sudah produktif" } },
      { no: 12, q: "Bagaimana respon keluarga atau orang terdekat atas pengajuan Pemohon?", opts: { a: "Tidak dikasih tahu atau tahu tapi kurang setuju", b: "Tahu tapi kayak tidak tahu-menahu (skeptis), terserah Pemohon/diam saja", c: "Tahu dan mendukung", d: "Ikut mendukung dan bersedia ikut bertanggung jawab" } },

    // =========================================================================
    function fmtRp(val) {
      const n = Number(val) || 0;
      return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(n);
    }

    function terbilang(angka) {
      angka = Math.floor(Math.abs(Number(angka) || 0));
      if (angka === 0) return "Nol Rupiah";
      const bil = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
      function konv(n) {
        if (n < 12) return " " + bil[n];
        if (n < 20) return konv(n - 10) + " Belas";
        if (n < 100) return konv(Math.floor(n / 10)) + " Puluh" + konv(n % 10);
        if (n < 200) return " Seratus" + konv(n - 100);
        if (n < 1000) return konv(Math.floor(n / 100)) + " Ratus" + konv(n % 100);
        if (n < 2000) return " Seribu" + konv(n - 1000);
        if (n < 1000000) return konv(Math.floor(n / 1000)) + " Ribu" + konv(n % 1000);
        if (n < 1000000000) return konv(Math.floor(n / 1000000)) + " Juta" + konv(n % 1000000);
        if (n < 1000000000000) return konv(Math.floor(n / 1000000000)) + " Miliar" + konv(n % 1000000000);
        return konv(Math.floor(n / 1000000000000)) + " Triliun" + konv(n % 1000000000000);
      }
      return (konv(angka).trim() + " Rupiah").replace(/\s+/g, ' ');
    }

    function parseTanggalParts(dateStr) {
      if (!dateStr) return { hari: "............", tgl: "....", bln: "............", thn: "20...." };
      const hariArr = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      const blnArr = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      const d = new Date(dateStr);
      if (isNaN(d)) return { hari: "............", tgl: "....", bln: "............", thn: "20...." };
      return {
        hari: hariArr[d.getDay()],
        tgl: String(d.getDate()).padStart(2, '0'),
        bln: blnArr[d.getMonth()],
        thn: String(d.getFullYear())
      };
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // =========================================================================
    // HELPER INPUT ANGKA NATURAL (TIDAK RE-RENDER SAAT MENGETIK)
    // =========================================================================
    function numInputHtml(path, val, opts = {}) {
      const n = Number(val) || 0;
      const formatted = n !== 0 ? fmtRp(n) : '';
      const cls = opts.cls || 'paper-input';
      const style = opts.style || 'width: 120px; text-align: right;';
      const placeholder = opts.placeholder !== undefined ? opts.placeholder : '0';
      const allowDecimal = opts.allowDecimal ? 'true' : 'false';
      const afterFn = opts.afterFn || '';

      return `<input type="text" inputmode="${opts.allowDecimal ? 'decimal' : 'numeric'}" class="${cls}" style="${style}" value="${formatted}" placeholder="${placeholder}" data-num-path="${path}" data-allow-decimal="${allowDecimal}" onfocus="handleNumFocus(this)" oninput="handleNumInput(this, ${afterFn ? `'${afterFn}'` : 'null'})" onblur="handleNumBlur(this, ${afterFn ? `'${afterFn}'` : 'null'})" />`;
    }

    function getPathVal(obj, path) {
      const parts = path.split('.');
      let cur = obj;
      for (let i = 0; i < parts.length; i++) {
        if (cur === undefined || cur === null) return 0;
        cur = cur[parts[i]];
      }
      return cur;
    }

    function handleNumFocus(el) {
      const r = getRec();
      const rawVal = Number(getPathVal(r, el.dataset.numPath)) || 0;
      el.value = rawVal === 0 ? '' : String(rawVal);
      setTimeout(() => {
        try { el.select(); } catch (e) {}
      }, 0);
    }

    function handleNumInput(el, afterFnName) {
      const allowDec = el.dataset.allowDecimal === 'true';
      let cleaned = el.value;
      if (allowDec) {
        cleaned = cleaned.replace(/,/g, '.').replace(/[^0-9.]/g, '');
        const dotIdx = cleaned.indexOf('.');
        if (dotIdx !== -1) {
          cleaned = cleaned.slice(0, dotIdx + 1) + cleaned.slice(dotIdx + 1).replace(/\./g, '');
        }
      } else {
        cleaned = cleaned.replace(/[^0-9]/g, '');
      }
      if (el.value !== cleaned) {
        el.value = cleaned;
      }
      const numVal = cleaned === '' ? 0 : (allowDec ? parseFloat(cleaned) || 0 : parseInt(cleaned, 10) || 0);
      setVal(el.dataset.numPath, numVal, false);
      if (afterFnName && typeof window[afterFnName] === 'function') {
        window[afterFnName]();
      }
    }

    function handleNumBlur(el, afterFnName) {
      const r = getRec();
      const allowDec = el.dataset.allowDecimal === 'true';
      const numVal = Number(getPathVal(r, el.dataset.numPath)) || 0;
      if (allowDec) {
        el.value = numVal !== 0 ? String(numVal) : '';
      } else {
        el.value = numVal !== 0 ? fmtRp(numVal) : '';
      }
      if (afterFnName && typeof window[afterFnName] === 'function') {
        window[afterFnName]();
      }
    }

        if (raw) {
          appList = JSON.parse(raw);

          appList = [createSampleRecord()];
          saveAllData(false);
        }
        activeId = appList[0].id;
      } catch (e) {
        appList = [createSampleRecord()];
        activeId = appList[0].id;
      }
    }

          el.classList.remove('opacity-0');

    }

        try {

      };
      reader.readAsDataURL(file);
    }

    function syncAllDomFields(r, sourceEl = null) {
      // Sinkronisasi input teks biasa berdasarkan atribut data-sync-path
      document.querySelectorAll('[data-sync-path]').forEach(el => {
        if (el === sourceEl) return;
        const p = el.dataset.syncPath;
        const val = getPathVal(r, p);
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
          el.value = val !== undefined && val !== null ? String(val) : '';
        } else {
          el.textContent = val !== undefined && val !== null && val !== '' ? String(val) : '....................';
        }
      });

      // Sinkronisasi input angka berdasarkan atribut data-num-path
      document.querySelectorAll('[data-num-path]').forEach(el => {
        if (el === sourceEl) return;
        const allowDec = el.dataset.allowDecimal === 'true';
        const numVal = Number(getPathVal(r, el.dataset.numPath)) || 0;
        if (allowDec) {
          el.value = numVal !== 0 ? String(numVal) : '';
        } else {
          el.value = numVal !== 0 ? fmtRp(numVal) : '';
        }
      });

      // Sinkronisasi gabungan alamat KTP & TTL
      const alamatFull = [r.alamatKtp, r.rtRwKtp ? 'RT/RW ' + r.rtRwKtp : '', r.kelDesaKtp, r.kecamatanKtp, r.kabKotaKtp].filter(Boolean).join(', ');
      document.querySelectorAll('.sync-alamat-full').forEach(el => {
        if (el !== sourceEl) el.value = alamatFull;
      });
      const alamatShort = [r.alamatKtp, r.kecamatanKtp, r.kabKotaKtp].filter(Boolean).join(', ');
      document.querySelectorAll('.sync-alamat-short').forEach(el => {
        if (el !== sourceEl) el.value = alamatShort;
      });
      const ttlShort = [r.tglLahir, r.blnLahir, r.thnLahir].filter(Boolean).join('-');
      document.querySelectorAll('.sync-ttl-short').forEach(el => {
        if (el !== sourceEl) el.value = ttlShort;
      });
      const agunanSummary = (r.suratAgunan || []).join(', ') + (r.agunanBerupa ? ' - ' + r.agunanBerupa : '');
      document.querySelectorAll('.sync-agunan-summary').forEach(el => {
        if (el !== sourceEl) el.value = agunanSummary;
      });
    }

    function setVal(path, value, refresh = false, sourceEl = null) {
      const r = getRec();
      const parts = path.split('.');
      let target = r;
      for (let i = 0; i < parts.length - 1; i++) {
        target = target[parts[i]];
      }
      target[parts[parts.length - 1]] = value;

      // Sinkronisasi otomatis lintas formulir
      if (path === 'namaLengkap') {
        r.namaPemohon = value;
        renderTopBar();
      }
      if (path === 'namaAosp') {
        r.baSurveyorNama = value;
        r.qSurveyorAoa = value;
        r.cfAnalisAoa = value;
        r.tPemeriksaNama = value;
        r.tPembuatAoap = value;
        r.kPemeriksaNama = value;
        r.kPembuatAoap = value;
      }
      if (path === 'jumlahPengajuan') {
        if (!r.cfPlafondDisetujui) r.cfPlafondDisetujui = Number(value) || 0;
      }
      if (path === 'jangkaWaktu') {
        r.cfJangkaWaktuDisetujui = Number(value) || 12;
      }

      saveAllData(true);
      if (refresh) {
        renderPaper();
      } else {
        syncAllDomFields(r, sourceEl);
      }
    }

    function toggleArr(path, item) {
      const r = getRec();
      const arr = r[path] || [];
      const idx = arr.indexOf(item);
      if (idx >= 0) arr.splice(idx, 1);
      else arr.push(item);
      r[path] = arr;
      saveAllData(true);
      renderPaper();
    }

    function calcQuestioner(r) {
      const map = { a: 10, b: 30, c: 70, d: 100 };
      let sum = 0;
      let count = 0;
      for (let i = 1; i <= 39; i++) {
        const ans = r.qAnswers[i];
        if (ans && map[ans] !== undefined) {
          sum += map[ans];
          count++;
        }
      }
      const skor = count > 0 ? Math.round((sum / count) * 100) / 100 : 0;
      let kategori = '-';
      if (count > 0) {
        if (skor < 55) kategori = 'Tidak layak';
        else if (skor < 70) kategori = 'Kurang layak';
        else if (skor < 80) kategori = 'Cukup layak';
        else if (skor < 90) kategori = 'Layak';
        else kategori = 'Sangat layak';
      }
      return { sum, count, skor, kategori };
    }

    function calcCashflow(r) {
      const konv = (row) => (Number(row.h) || 0) * 30 + (Number(row.m) || 0) * 4 + (Number(row.b) || 0);
      const totPendUsaha = r.cfUsahaPendapatan.reduce((s, x) => s + konv(x), 0);
      const totPengUsaha = r.cfUsahaPengeluaran.reduce((s, x) => s + konv(x), 0);
      const bersihUsaha = totPendUsaha - totPengUsaha;

      const totPendRt = r.cfRtPendapatan.reduce((s, x) => s + konv(x), 0);
      const totPengRt = r.cfRtPengeluaran.reduce((s, x) => s + konv(x), 0);
      const bersihPerbulan = bersihUsaha + totPendRt - totPengRt;

      const plafon = Number(r.jumlahPengajuan) || 0;
      const tenor = Number(r.jangkaWaktu) || 1;
      const marginPct = Number(r.cfMarginPersen) || 0;
      const marginRp = Math.round(plafon * (marginPct / 100));
      const angsuran = Math.round(plafon / tenor) + marginRp;

      const persenAngsuran = bersihPerbulan > 0 ? Math.round((angsuran / bersihPerbulan) * 1000) / 10 : 0;

      let kemampuan = 'a. Tidak Mampu';
      if (bersihPerbulan > 0) {
        if (persenAngsuran <= 30) kemampuan = 'd. Sangat Mampu';
        else if (persenAngsuran <= 45) kemampuan = 'c. Mampu';
        else if (persenAngsuran <= 65) kemampuan = 'b. Kurang Mampu';
        else kemampuan = 'a. Tidak Mampu';
      }

      return {
        konv, totPendUsaha, totPengUsaha, bersihUsaha,
        totPendRt, totPengRt, bersihPerbulan,
        plafon, tenor, marginPct, marginRp, angsuran,
        persenAngsuran, kemampuan
      };
    }

                `;
              }).join('')}

    // -------------------- LEMBAR 4: PMB/FRM/004/REV00 (39 PERTANYAAN) --------------------
    function renderSheet4(r) {
      const qStats = calcQuestioner(r);
      const ptMap = { a: 10, b: 30, c: 70, d: 100 };
      const qPart1 = QUESTIONER_39.slice(0, 14);
      const qPart2 = QUESTIONER_39.slice(14, 28);
      const qPart3 = QUESTIONER_39.slice(28, 39);

      const renderQuestionsBlock = (list) => list.map(item => {
        const chosen = r.qAnswers[item.no] || '';
        const scoreVal = chosen ? ptMap[chosen] : '';
        return `
          <div style="margin-bottom: 5px; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; border-bottom: 0.5px dotted #d1d5db; padding-bottom: 3px;">
            <div style="flex: 1;">
              <div style="font-weight: bold; font-size: 8.4pt; margin-bottom: 1.5px;">${item.no}. ${item.q}</div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; padding-left: 12px; font-size: 8pt;">
                ${['a', 'b', 'c', 'd'].map(k => {
                  const isSel = chosen === k;
                  return `
                    <div class="paper-chk ${isSel ? 'checked' : ''}" style="margin-right: 0; align-items: flex-start;" onclick="setVal('qAnswers.${item.no}', '${k}', true)">
                      <span class="paper-chk-box" style="margin-top: 1px;">${isSel ? '✓' : '&nbsp;'}</span>
                      <span><strong>${k}.</strong> ${item.opts[k]}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            <div style="width: 36px; border: 1px solid #000; text-align: center; font-size: 8pt; font-weight: bold; padding: 2px 0; background: ${scoreVal ? '#e6f4ee' : '#fff'}; flex-shrink: 0;">
              ${scoreVal || '&nbsp;'}
            </div>
          </div>
        `;
      }).join('');

      return `
        <!-- Halaman 1 Questioner (No 1 - 14) -->
        <div class="a4-sheet">
          ${renderKopSurat()}
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 8.5pt;">
            <div class="cabang-box">
              <span>CABANG / CAPEM :</span>
              <input class="cabang-in" data-sync-path="cabang" value="${esc(r.cabang)}" oninput="setVal('cabang', this.value, false, this)" />
            </div>
            <div style="font-weight: bold; font-size: 11pt; text-decoration: underline;">QUESTIONER SURVEY</div>
            <div style="border: 1px solid #000; padding: 2px 8px; font-weight: bold;">PMB/FRM/004/REV00</div>
          </div>
          <div style="font-size: 8.3pt; margin-bottom: 6px; display: flex; justify-content: space-between; border-bottom: 1px solid #000; padding-bottom: 3px;">
            <div><strong>A. Jawab dan pilih sesuai penilaian dan hasil surve.</strong> Masing-masing pilihan memiliki nilai, <strong>a:10, b:30, c:70, d:100</strong></div>
            <div>Pemohon: <strong data-sync-path="namaLengkap">${esc(r.namaLengkap || '-')}</strong></div>
          </div>
          ${renderQuestionsBlock(qPart1)}
        </div>

        <!-- Halaman 2 Questioner (No 15 - 28) -->
        <div class="a4-sheet">
          ${renderKopSurat()}
          <div style="display: flex; justify-content: space-between; font-size: 8pt; margin-bottom: 5px; border-bottom: 1px solid #000; padding-bottom: 2px;">
            <span><strong>QUESTIONER SURVEY (Lanjutan)</strong> - Pemohon: <strong data-sync-path="namaLengkap">${esc(r.namaLengkap || '-')}</strong></span>
            <span><strong>PMB/FRM/004/REV00</strong></span>
          </div>
          ${renderQuestionsBlock(qPart2)}
        </div>

        <!-- Halaman 3 Questioner (No 29 - 39 + Rumus B + C + D + TTD) -->
        <div class="a4-sheet">
          ${renderKopSurat()}
          <div style="display: flex; justify-content: space-between; font-size: 8pt; margin-bottom: 5px; border-bottom: 1px solid #000; padding-bottom: 2px;">
            <span><strong>QUESTIONER SURVEY (Lanjutan)</strong> - Pemohon: <strong data-sync-path="namaLengkap">${esc(r.namaLengkap || '-')}</strong></span>
            <span><strong>PMB/FRM/004/REV00</strong></span>
          </div>
          ${renderQuestionsBlock(qPart3)}

          <!-- Bagian B: Hasil Perhitungan Otomatis -->
          <div style="margin-top: 8px; border: 1px solid #000; padding: 6px 8px; font-size: 8.3pt;">
            <div style="font-weight: bold; margin-bottom: 4px;">
              B. Hasilnya dijumlahkan dan dibagi quesioner yang terjawab, maka hasilnya adalah nilai dari analisa, jika nilainya:
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: center;">
              <div style="font-size: 8pt; line-height: 1.35;">
                <div style="${qStats.kategori === 'Tidak layak' ? 'font-weight:bold; background:#fee2e2; padding:1px 3px;' : ''}">&lt; 55 : tidak layak "Tidak boleh dicairkan"</div>
                <div style="${qStats.kategori === 'Kurang layak' ? 'font-weight:bold; background:#ffedd5; padding:1px 3px;' : ''}">56 - 69 : kurang layak, recommended "tidak dicairkan"</div>
                <div style="${qStats.kategori === 'Cukup layak' ? 'font-weight:bold; background:#fef3c7; padding:1px 3px;' : ''}">70 - 79 : cukup layak "dicairkan dengan banyak pertimbangan"</div>
                <div style="${qStats.kategori === 'Layak' ? 'font-weight:bold; background:#d1fae5; padding:1px 3px;' : ''}">80 - 89 : layak "dicairkan"</div>
                <div style="${qStats.kategori === 'Sangat layak' ? 'font-weight:bold; background:#bbf7d0; padding:1px 3px;' : ''}">90 - 100 : sangat layak "dicairkan tanpa terkecuali"</div>
              </div>
              <div style="border: 1px solid #000; padding: 6px; background: #f9fafb;">
                <div style="font-weight: bold; margin-bottom: 4px;">Rumus:</div>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <div style="text-align: center;">
                    <div style="border-bottom: 1px solid #000; padding: 0 6px;">Jumlah Point jawaban: <strong>${qStats.sum}</strong></div>
                    <div style="padding: 0 6px;">Questioner yang terisi: <strong>${qStats.count}</strong></div>
                  </div>
                  <div style="font-size: 11pt; font-weight: bold;">= Skor: <span style="text-decoration: underline;">${qStats.skor}</span></div>
                </div>
                <div style="margin-top: 6px; font-weight: bold;">
                  Masuk Kategori:
                  <span style="${qStats.kategori === 'Tidak layak' ? 'text-decoration:underline; background:#fee2e2; padding:1px 3px;' : 'color:#6b7280;'}">Tidak layak</span> /
                  <span style="${qStats.kategori === 'Kurang layak' ? 'text-decoration:underline; background:#ffedd5; padding:1px 3px;' : 'color:#6b7280;'}">Kurang layak</span> /
                  <span style="${qStats.kategori === 'Cukup layak' ? 'text-decoration:underline; background:#fef3c7; padding:1px 3px;' : 'color:#6b7280;'}">Cukup layak</span> /
                  <span style="${qStats.kategori === 'Layak' ? 'text-decoration:underline; background:#d1fae5; padding:1px 3px;' : 'color:#6b7280;'}">Layak</span> /
                  <span style="${qStats.kategori === 'Sangat layak' ? 'text-decoration:underline; background:#bbf7d0; padding:1px 3px;' : 'color:#6b7280;'}">Sangat layak</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Bagian C & D -->
          <div style="margin-top: 6px; font-size: 8.5pt;">
            <div style="font-weight: bold; margin-bottom: 2px;">C. Apa potensi masalahnya dan bagaimana menanggulanginya?</div>
            <textarea class="paper-textarea" rows="2" oninput="setVal('qPotensiMasalah', this.value)">${esc(r.qPotensiMasalah)}</textarea>
          </div>
          <div style="margin-top: 5px; font-size: 8.5pt;">
            <div style="font-weight: bold; margin-bottom: 2px;">D. Kesimpulan dan keterangan</div>
            <textarea class="paper-textarea" rows="2" oninput="setVal('qKesimpulan', this.value)">${esc(r.qKesimpulan)}</textarea>
          </div>

          <div style="text-align: right; font-size: 8.3pt; margin-top: 6px;">
            <input class="paper-input" data-sync-path="cabang" style="width: 110px; text-align: right;" value="${esc(r.cabang)}" oninput="setVal('cabang', this.value, false, this)" /> ,
            <input type="date" class="paper-input" style="width: 110px;" value="${esc(r.qTanggal)}" onchange="setVal('qTanggal', this.value)" />
          </div>

          <table class="layout-table" style="text-align: center; font-size: 8.5pt; margin-top: 4px;">
            <tr>
              <td style="width: 50%;">
                Surveyor<br/><br/><br/>
                ( <input class="paper-input" data-sync-path="qSurveyorAoa" style="width: 160px; text-align: center;" value="${esc(r.qSurveyorAoa)}" oninput="setVal('qSurveyorAoa', this.value, false, this)" /> )<br/>
                <strong>AOA</strong>
              </td>
              <td style="width: 50%;">
                Pemeriksa<br/><br/><br/>
                ( <input class="paper-input" style="width: 160px; text-align: center;" value="${esc(r.qPemeriksaKpl)}" oninput="setVal('qPemeriksaKpl', this.value)" /> )<br/>
                <strong>KPL</strong>
              </td>
            </tr>
          </table>
        </div>
      `;
    }

    // -------------------- LEMBAR 5: PMB/FRM/005/REV00 (CASHFLOW ANALYSIS) --------------------
    function renderSheet5(r) {
      const cf = calcCashflow(r);
      const alamatFull = [r.alamatKtp, r.kecamatanKtp, r.kabKotaKtp].filter(Boolean).join(', ');

      const renderCfGroup = (arr, pathPrefix, domPrefix) => arr.map((row, idx) => {
        const monthly = cf.konv(row);
        return `
          <tr>
            <td style="width: 22px; text-align: center;">${idx + 1}.</td>
            <td><input class="cell-input" value="${esc(row.ket)}" oninput="setVal('${pathPrefix}.${idx}.ket', this.value)" placeholder="Keterangan pos..." /></td>
            <td style="width: 86px;">${numInputHtml(`${pathPrefix}.${idx}.h`, row.h, { cls: 'cell-input', style: 'width: 100%; text-align: right;', placeholder: '0', afterFn: 'updateCashflowSummaryDom' })}</td>
            <td style="width: 86px;">${numInputHtml(`${pathPrefix}.${idx}.m`, row.m, { cls: 'cell-input', style: 'width: 100%; text-align: right;', placeholder: '0', afterFn: 'updateCashflowSummaryDom' })}</td>
            <td style="width: 86px;">${numInputHtml(`${pathPrefix}.${idx}.b`, row.b, { cls: 'cell-input', style: 'width: 100%; text-align: right;', placeholder: '0', afterFn: 'updateCashflowSummaryDom' })}</td>
            <td id="cf-row-${domPrefix}-${idx}" style="width: 95px; text-align: right; font-weight: bold;">${monthly ? fmtRp(monthly) : '0'}</td>
          </tr>
        `;
      }).join('');

      return `

          ${renderKopSurat()}

            <div class="cabang-box">
              <span>CABANG / CAPEM :</span>

            <div style="border: 1px solid #000; padding: 2px 6px; font-size: 8pt; font-weight: bold;">PMB/FRM/005/REV00</div>

              <td style="width: 75px; font-weight: bold;">Nama</td>

              <td style="width: 75px; font-weight: bold;">Telephone</td>
              <td style="width: 150px;"><input class="cell-input" data-sync-path="noHp" value="${esc(r.noHp)}" oninput="setVal('noHp', this.value, false, this)" /></td>
            </tr>
            <tr>
              <td style="font-weight: bold;">Alamat</td>
              <td colspan="3"><input class="cell-input sync-alamat-short" value="${esc(alamatFull)}" oninput="setVal('alamatKtp', this.value, false, this)" /></td>
            </tr>
          </table>

          <table class="form-table" style="font-size: 7.9pt;">
            <thead>
              <tr>
                <th colspan="2">Pendapatan dan Pengeluaran</th>
                <th>Harian</th>
                <th>Mingguan</th>
                <th>Bulanan</th>
                <th>Konversi Akhir (Bulanan)</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="6" style="font-weight: bold; background: #e5e7eb;">INFORMASI USAHA — Pendapatan</td></tr>
              ${renderCfGroup(r.cfUsahaPendapatan, 'cfUsahaPendapatan', 'up')}
              <tr style="font-weight: bold; background: #f3f4f6;">
                <td colspan="5" style="text-align: right;">Total Pendapatan Usaha</td>
                <td id="cf-tot-pend-usaha" style="text-align: right;">Rp ${fmtRp(cf.totPendUsaha)}</td>

              <tr><td colspan="6" style="font-weight: bold; background: #e5e7eb;">INFORMASI USAHA — Pengeluaran</td></tr>
              ${renderCfGroup(r.cfUsahaPengeluaran, 'cfUsahaPengeluaran', 'uk')}
              <tr style="font-weight: bold; background: #f3f4f6;">
                <td colspan="5" style="text-align: right;">Total Pengeluaran Usaha</td>
                <td id="cf-tot-peng-usaha" style="text-align: right;">Rp ${fmtRp(cf.totPengUsaha)}</td>
              </tr>
              <tr style="font-weight: bold; background: #d1fae5;">
                <td colspan="5" style="text-align: right;">Pendapatan Bersih Usaha</td>

                <td id="cf-tot-peng-rt" style="text-align: right;">Rp ${fmtRp(cf.totPengRt)}</td>

    // =========================================================================
    // 7. TOP BAR NAVIGATION, MENU PEMBIAYAAN, RECORD SWITCHER & PRINT
    // =========================================================================
    function togglePembiayaanDropdown() {
      const dd = document.getElementById('pembiayaan-dropdown');
      if (dd) dd.classList.toggle('hidden');
    }

    function selectPembiayaanItem(val) {
      const dd = document.getElementById('pembiayaan-dropdown');
      if (dd) dd.classList.add('hidden');
      switchTab(val);
    }

    document.addEventListener('click', function(e) {
      const wrapper = document.getElementById('pembiayaan-menu-wrapper');
      const dd = document.getElementById('pembiayaan-dropdown');
      if (wrapper && dd && !wrapper.contains(e.target)) {
        dd.classList.add('hidden');
      }
    });

    function renderTopBar() {
      const sel = document.getElementById('select-berkas');
      sel.innerHTML = appList.map(item =>
        `<option value="${item.id}" ${item.id === activeId ? 'selected' : ''}>${esc(item.namaLengkap || 'Berkas Baru (Tanpa Nama)')}</option>`
      ).join('');

      const btnReset = document.getElementById('btn-reset-kop');
      if (customKopBase64) btnReset.classList.remove('hidden');
      else btnReset.classList.add('hidden');

      const btnClearCf = document.getElementById('btn-clear-cashflow');
      if (btnClearCf) {
        if (activeTab === 5 || activeTab === 'ALL') btnClearCf.classList.remove('hidden');
        else btnClearCf.classList.add('hidden');
      }

      // Update lencana aktif di tombol utama PEMBIAYAAN
      const badge = document.getElementById('pembiayaan-active-badge');
      if (badge) {
        if (activeTab === 'ALL') {
          badge.textContent = 'Semua (8 Lembar)';
        } else {
          const cur = TABS_DEF.find(x => x.id === activeTab);
          badge.textContent = cur ? cur.short : 'Semua (8 Lembar)';
        }
      }

      // Highlight item "Tampilkan Semua (8 Lembar)" di dropdown
      const ddAll = document.getElementById('dd-item-ALL');
      if (ddAll) {
        if (activeTab === 'ALL') ddAll.classList.add('bg-emerald-50', 'text-emerald-900');
        else ddAll.classList.remove('bg-emerald-50', 'text-emerald-900');
      }

      // Render daftar sub-menu di dropdown PEMBIAYAAN
      const ddItems = document.getElementById('pembiayaan-dropdown-items');
      if (ddItems) {
        ddItems.innerHTML = TABS_DEF.map(t => {
          const isAct = t.id === activeTab;
          return `
            <button type="button" onclick="selectPembiayaanItem(${t.id})" class="w-full text-left px-3 py-2 text-xs hover:bg-emerald-50 flex items-center justify-between ${isAct ? 'bg-emerald-50 font-extrabold text-emerald-900' : 'text-gray-700 font-medium'}">
              <span>${t.label}</span>
              ${isAct ? '<span class="text-emerald-700 font-bold">✓</span>' : ''}
            </button>
          `;
        }).join('');
      }

      // Render bilah pintasan cepat di sebelah tombol PEMBIAYAAN
      const nav = document.getElementById('nav-tabs');
      const allBtn = `
        <button onclick="switchTab('ALL')" class="px-2.5 py-1 rounded-md text-xs font-bold whitespace-nowrap transition ${activeTab === 'ALL' ? 'bg-white text-[#14533c] shadow-xs' : 'text-emerald-100 hover:bg-emerald-800'}">
          📑 Semua (8 Form)
        </button>
      `;
      nav.innerHTML = allBtn + TABS_DEF.map(t => {
        const isAct = t.id === activeTab;
        return `
          <button onclick="switchTab(${t.id})" class="px-2.5 py-1 rounded-md text-xs font-bold whitespace-nowrap transition ${isAct ? 'bg-white text-[#14533c] shadow-xs' : 'text-emerald-100 hover:bg-emerald-800'}">
            ${t.label}
          </button>
        `;
      }).join('');
    }

    function renderPaper() {
      const r = getRec();
      const container = document.getElementById('paper-container');
      if (isPrintingAll || activeTab === 'ALL') {
        container.innerHTML =
          renderSheet1(r) +
          renderSheet2(r) +
          renderSheet3(r) +
          renderSheet4(r) +
          renderSheet5(r) +
          renderSheet6(r) +
          renderSheet7(r) +
          renderSheet8(r);
        return;
      }

      switch (activeTab) {
        case 1: container.innerHTML = renderSheet1(r); break;
        case 2: container.innerHTML = renderSheet2(r); break;
        case 3: container.innerHTML = renderSheet3(r); break;
        case 4: container.innerHTML = renderSheet4(r); break;
        case 5: container.innerHTML = renderSheet5(r); break;
        case 6: container.innerHTML = renderSheet6(r); break;
        case 7: container.innerHTML = renderSheet7(r); break;
        case 8: container.innerHTML = renderSheet8(r); break;
      }
    }

    function switchTab(tabId) {
      activeTab = tabId;
      isPrintingAll = false;
      renderTopBar();
      renderPaper();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchApplication(id) {
      activeId = id;
      renderTopBar();
      renderPaper();
    }

    function createNewApplication() {
      const rec = createBlankRecord();
      appList.unshift(rec);
      activeId = rec.id;
      activeTab = 'ALL';
      saveAllData(true);
      renderTopBar();
      renderPaper();
    }

    function deleteCurrentApplication() {
      if (appList.length <= 1) {
        appList = [createBlankRecord()];
        activeId = appList[0].id;
      } else {
        appList = appList.filter(x => x.id !== activeId);
        activeId = appList[0].id;
      }
      saveAllData(true);
      renderTopBar();
      renderPaper();
    }

    function printActiveSheet() {
      isPrintingAll = false;
      renderPaper();
      setTimeout(() => window.print(), 120);
    }

    function printAllSheets() {
      isPrintingAll = true;
      renderPaper();
      setTimeout(() => {
        window.print();
      }, 150);
    }

    window.addEventListener('afterprint', () => {
      if (isPrintingAll) {
        isPrintingAll = false;
        renderPaper();
      }
    });

    // =========================================================================
    // 8. INIT
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadAllData();
      renderTopBar();
      renderPaper();
    });
  </script>
